[package]
name = "musicl"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
chrono = "0.4"
glob = "0.3.3"
id3 = "1.17.0"
csv = "1.1"
serde = { version = "1", features = ["derive"] }
